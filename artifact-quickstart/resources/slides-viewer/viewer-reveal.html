<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none'; form-action 'none'; connect-src 'self'">
<title>Slides Viewer (reveal.js)</title>
<link rel="stylesheet" href="vendor/reveal/reveal.css">
<style>
  /* Chrome-Farben kommen aus tokens.json; reveal.js liest sie über seine --r-* Variablen. */
  :root {
    --r-background-color: var(--c-stage);
    --r-main-color: var(--c-text);
    --r-link-color: var(--c-accent);
    --r-link-color-hover: var(--c-accent);
    --r-overlay-element-bg-color: 0, 0, 0;
    --r-overlay-element-fg-color: 240, 240, 240;
  }
  html, body { height: 100%; margin: 0; background: var(--c-stage); }
  .reveal-viewport { background: var(--c-stage); }
  .reveal .controls, .reveal .progress { color: var(--c-accent); }
  .reveal .slide-number { background: transparent; color: var(--c-muted); font: var(--s-caption) var(--f-mono); }
  body { font: var(--s-ui) / 1.4 var(--f-ui); color: var(--c-text); }
  #msg { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; padding: 24px; color: var(--c-muted); }
  #msg[hidden] { display: none; }
  #msg code { font-family: var(--f-mono); color: var(--c-text); }

  /* Folien: reveal.js darf die Hülle steuern, der Inhalt folgt dem Folienformat. */
  .reveal .slides > section { padding: 0 !important; text-align: left; }
  .reveal .slides .slide {
    position: relative; width: 1920px; height: 1080px; overflow: hidden; box-sizing: border-box;
    background: #fff; color: #000; font-size: 16px; font-weight: 400; line-height: normal;
    text-transform: none; letter-spacing: normal; text-shadow: none;
  }
  .reveal .slides .slide *, .reveal .slides .slide *::before, .reveal .slides .slide *::after { box-sizing: border-box; }
  .reveal .slides .slide, .reveal .slides .slide div { display: flex; flex-direction: column; }
  .reveal .slides .slide h1, .reveal .slides .slide h2, .reveal .slides .slide h3,
  .reveal .slides .slide p, .reveal .slides .slide ul, .reveal .slides .slide ol {
    margin: 0; text-transform: none; letter-spacing: normal; text-shadow: none; text-align: inherit; max-width: none;
  }
  .reveal .slides .slide h1 { font-size: 96px; font-weight: 600; line-height: 1.1; }
  .reveal .slides .slide h2 { font-size: 64px; font-weight: 600; line-height: 1.15; }
  .reveal .slides .slide h3 { font-size: 44px; font-weight: 600; line-height: 1.2; }
  .reveal .slides .slide p { font-size: 32px; line-height: 1.4; }
  .reveal .slides .slide ul, .reveal .slides .slide ol { display: block; padding-left: 1.1em; font-size: 32px; line-height: 1.4; }
  .reveal .slides .slide li { display: list-item; margin: 0; }
  .reveal .slides .slide table { border-collapse: collapse; font-size: 32px; margin: 0; }
  .reveal .slides .slide th, .reveal .slides .slide td { border: 1px solid rgba(128,128,128,.45); padding: .35em .6em; text-align: left; }
  .reveal .slides .slide th { font-weight: 600; }
  .reveal .slides .slide hr { border: 0; border-top: 2px solid currentColor; width: 100%; margin: 0; height: 0; }
  .reveal .slides .slide img, .reveal .slides .slide video, .reveal .slides .slide iframe, .reveal .slides .slide svg {
    max-width: none; max-height: none; margin: 0; border: 0; box-shadow: none; background: transparent;
  }
  .reveal .slides .slide img { display: block; }
</style>
</head>
<body>
<div class="reveal"><div class="slides" id="slides"></div></div>
<div id="msg" hidden></div>
<!--INJECT-->
<script src="slide-convert.js"></script>
<script src="vendor/reveal/reveal.js"></script>
<script src="vendor/reveal/notes.js"></script>
<script>
"use strict";
const state = { deck: null, slides: {}, order: [] };
const $ = (id) => document.getElementById(id);
function message(html) { const m = $('msg'); m.innerHTML = html; m.hidden = false; }

// data-transition und data-build-in der Vorlage auf reveal.js abbilden.
const TRANSITION = { fade: 'fade', push: 'slide', magic: 'slide' };
const BUILD = { fade: 'fade-in', rise: 'fade-up', drop: 'fade-down', left: 'fade-right', right: 'fade-left', scale: 'grow', pop: 'grow' };

function slideSection(id) {
  const p = prepareSlide(state.slides[id], id);
  const wrap = document.createElement('section');
  if (!p.sec) { wrap.textContent = 'Keine <section> in dieser Folie.'; return wrap; }
  const sec = p.sec;
  const tr = sec.getAttribute('data-transition');
  if (tr && TRANSITION[tr]) wrap.setAttribute('data-transition', TRANSITION[tr]);
  if (tr === 'magic') {
    wrap.setAttribute('data-auto-animate', '');
    sec.querySelectorAll('[id]').forEach((el) => { el.setAttribute('data-id', el.id); el.removeAttribute('id'); });
  }
  sec.querySelectorAll('[data-build-in]').forEach((el) => {
    const [kind, order] = el.getAttribute('data-build-in').trim().split(/\s+/);
    el.classList.add('fragment');
    if (BUILD[kind] && BUILD[kind] !== 'fade-in') el.classList.add(BUILD[kind]);
    if (/^\d+$/.test(order || '')) el.setAttribute('data-fragment-index', order);
  });
  const inner = document.createElement('div');
  inner.className = 'slide';
  inner.setAttribute('style', sec.getAttribute('style') || '');
  inner.innerHTML = sec.innerHTML;
  wrap.append(inner);
  if (p.notes) { const a = document.createElement('aside'); a.className = 'notes'; a.textContent = p.notes; wrap.append(a); }
  return wrap;
}

loadDeck(state).then(() => {
  if (!state.order.length) { message('Das Deck enthält keine Folien.'); return; }
  const head = fontHead(state.deck.faces);
  if (head) document.head.insertAdjacentHTML('beforeend', head);
  document.title = state.deck.title || 'Slides';
  const root = $('slides');
  state.order.forEach((id) => root.append(slideSection(id)));
  const deck = new Reveal(document.querySelector('.reveal'), {
    width: 1920, height: 1080, margin: 0, minScale: 0.05, maxScale: 3, center: false,
    hash: true, controls: true, progress: true, slideNumber: 'c/t', transition: 'none',
    plugins: [RevealNotes]
  });
  const setNotes = (on) => { deck.configure({ showNotes: on }); requestAnimationFrame(() => deck.layout()); };
  deck.initialize().then(() => {
    document.addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === 'g' || e.key === 'G') deck.toggleOverview();
      else if (e.key === 'n' || e.key === 'N') setNotes(!deck.getConfig().showNotes);
    });
    const q = new URLSearchParams(location.search);
    if (q.get('shownotes') === '1') setNotes(true);
    if (q.get('grid') === '1') deck.toggleOverview(true);
  });
}).catch((err) => {
  message(`Laden fehlgeschlagen: <code></code><br>Per <code>file://</code> klappt <code>fetch</code> nicht. Entweder einen lokalen Server starten oder mit <code>build_standalone.py</code> eine Einzeldatei bauen.`);
  $('msg').querySelector('code').textContent = err.message;
});
</script>
</body>
</html>
